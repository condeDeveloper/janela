name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.so }}

    # bash nos tres sistemas: no Windows o shell padrao e o PowerShell, e ele
    # desmonta "-Dexec.args=..." em dois argumentos antes de o Maven ver.
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Testes
        run: mvn -B -ntp verify

      - name: a correcao contra a varredura ingenua
        run: mvn -B -ntp -q exec:java -Dexec.args="correcao"

      - name: o custo por elemento
        run: mvn -B -ntp -q exec:java -Dexec.args="custo"

      - name: o pior passo que o amortizado esconde
        run: mvn -B -ntp -q exec:java -Dexec.args="passo"

      - name: a memoria do descarte tardio
        run: mvn -B -ntp -q exec:java -Dexec.args="memoria"

      - name: a deriva da soma incremental
        run: mvn -B -ntp -q exec:java -Dexec.args="deriva"

      - name: Relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.so }}
          path: target/surefire-reports
